# ============================================================
# RoboDriver-Server 服务配置
# ============================================================

# ----------------------------------------------------------
# 机器人配置
# ----------------------------------------------------------
now_robot_type: [aloha, pika, realman, dexterous_hand, so101, galaxea]
robot_type: franka

# ----------------------------------------------------------
# 设备服务地址
# ----------------------------------------------------------
device_server_ip: http://localhost:8088
device_server_port: 8088
device_data_path: /home/robot/DoRobot/dataset/

# ----------------------------------------------------------
# 数据管线模式
#   internal  - 内网直传（默认，使用 internal_sync.py）
#   cloud     - 云端上传（保留扩展）
# ----------------------------------------------------------
pipeline_mode: internal

# internal 模式配置
internal:
  # internal_config.yaml 路径（相对 x86/ 或绝对路径）
  config_path: internal_config.yaml
  # 采集完成后是否自动触发同步
  auto_sync_after_collection: false
  # 同步前是否 GPU 编码图片为视频
  gpu_encode_before_sync: false

# cloud 模式配置（保留扩展）
cloud:
  upload_type: ks3
  upload_time: '20:00'
  is_upload: false
  upload_immadiately_gpu: false
  is_collect_upload_at_sametime: false
  platform_server_ip: https://roboxstudio.baai.ac.cn
  # BAAI 平台凭证（从 roboxstudio.baai.ac.cn 获取）
  baai_ak: ""
  baai_sk: ""

# ----------------------------------------------------------
# 日志
# ----------------------------------------------------------
log_path: /opt/RoboDriver-log/log/server/

# ----------------------------------------------------------
# 机器信息上报
# ----------------------------------------------------------
is_update_machine_information: true
